<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local AI Search — app local</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317171c'/%3E%3Cpath d='M8 22V10l8 8 8-8v12' fill='none' stroke='white' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <aside class="lateral">
    <div class="lateral-head">
      <div class="marca">Local AI Search<small>app local · seus modelos, seu PC</small></div>
      <button class="tema-toggle" id="btn-tema" type="button" title="Alternar entre modo claro e escuro">🌙 Modo Escuro</button>
    </div>
    <div class="alvo" id="alvo"></div>
    <nav class="abas" role="tablist" id="abas"></nav>
    <div class="apoio" id="apoio"></div>
    <div class="status" id="status"></div>
  </aside>
  <main>
    <div id="banner-alvo"></div>
    <section class="pagina" id="p-decidir"></section>
    <section class="pagina" id="p-modelos"></section>
    <section class="pagina" id="p-radar"></section>
    <section class="pagina" id="p-calculadora"></section>
    <section class="pagina" id="p-parque"></section>
    <section class="pagina" id="p-offline"></section>
    <section class="pagina" id="p-medir"></section>
    <section class="pagina ajuda" id="p-ajuda"></section>
    <section class="pagina" id="p-guias"></section>
  </main>
</div>
<div id="tarefa-barra"></div>
<dialog id="dlg"><div class="dlg-in" id="dlg-in"></div></dialog>
<script src="base.js"></script>
<script src="apoio.js"></script>
<script src="calc.js"></script>
<script src="calc-ui.js"></script>
<script src="app-decidir.js"></script>
<script src="app-radar.js"></script>
<script src="app-parque.js"></script>
<script src="app-medir.js"></script>
<script src="app-guias.js"></script>
<script src="app.js"></script>
<script src="antigravity-fx.js"></script>
</body>
</html>
