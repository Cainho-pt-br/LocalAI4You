<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Painel interno</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#14161f;--muted:#646b7d;--line:#e3e6ef;--acc:#6d4aff}
@media (prefers-color-scheme:dark){:root{--bg:#0d0f16;--card:#161925;--ink:#eef0f6;--muted:#9aa1b4;--line:#262a3a;--acc:#9b85ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 60px}h1{margin:0 0 4px}h2{font-size:1.05rem;margin:28px 0 10px}
.sub{color:var(--muted);font-size:.88rem}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.kpi b{display:block;font-size:1.7rem;font-variant-numeric:tabular-nums}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.caixa{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}form{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
input,button{font:inherit;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink)}button{background:var(--acc);color:#fff;border:0;cursor:pointer}
.vazio{color:var(--muted);font-style:italic}
.funil{display:flex;flex-direction:column;gap:8px}.funil-l{display:grid;grid-template-columns:minmax(150px,260px) 1fr 90px;gap:10px;align-items:center}
.barra{height:22px;background:var(--line);border-radius:6px;overflow:hidden}.barra i{display:block;height:100%;background:var(--acc)}
.delta{font-size:.8rem;margin-left:6px}.up{color:#16a34a}.down{color:#dc2626}.insights{margin:14px 0 0;padding-left:18px}.insights li{margin:4px 0}
@media (max-width:560px){.funil-l{grid-template-columns:1fr 70px}.funil-l .barra{grid-column:1/-1}}
</style>
</head>
<body><main>
<h1>Painel interno</h1>
<div class="sub">Números somados: site nos últimos 30 dias (com comparação semana contra semana) e todos os envios da comunidade. Nada individual.</div>
<form id="f"><input id="s" type="password" placeholder="Senha do painel" autocomplete="current-password" required><button>Abrir</button><span id="st" class="sub"></span></form>
<div id="out"></div>
</main>
<script>
const $ = s => document.querySelector(s), esc = v => String(v ?? '—').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
function tabela(titulo, linhas, cols, dica) {
  const corpo = linhas && linhas.length ? '<table><tr>' + cols.map(c => `<th class="${c[2]||''}">${c[1]}</th>`).join('') + '</tr>' +
    linhas.map(l => '<tr>' + cols.map(c => `<td class="${c[2]||''}">${esc(l[c[0]])}</td>`).join('') + '</tr>').join('') + '</table>'
    : '<div class="vazio">Ainda sem dados.</div>';
  return `<div class="caixa"><h2 style="margin-top:0">${titulo}</h2>${dica ? `<div class="sub" style="margin:-6px 0 8px">${dica}</div>` : ''}${corpo}</div>`;
}
function delta(sem, tipo) {
  const x = sem[tipo]; if (!x) return '';
  if (!x.anterior) return x.atual ? '<span class="delta up">novo</span>' : '';
  const d = Math.round(100 * (x.atual - x.anterior) / x.anterior);
  return `<span class="delta ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d)}%</span>`;
}
function leituras(d) {
  const f = d.funil.map(x => x.n), t = d.totais, out = [];
  if (f[0] < 30) out.push(`Ainda são poucas visitas (${f[0]} em 30 dias): trate as porcentagens como pista, não como conclusão.`);
  if (f[0]) out.push(`${pct(f[1], f[0])}% das visitas chegam a ver o Radar${pct(f[1], f[0]) < 50 ? ' — a página inicial pode estar segurando gente demais antes dele' : ''}.`);
  if (f[1]) out.push(`Das que viram o Radar, ${pct(f[2], f[1])}% copiaram um comando ou clicaram numa loja, e ${pct(f[3], f[1])}% baixaram o app.`);
  if (t.celular_pct >= 40) out.push(`${t.celular_pct}% vêm do celular, onde não dá para instalar modelos: vale caprichar no "manda o link para o computador".`);
  const hw = d.hardware_site || [];
  if (hw.length) { const tot = hw.reduce((a, x) => a + x.visitas, 0), det = hw.reduce((a, x) => a + x.detectado, 0);
    out.push(`Hardware mais visto: ${esc(hw[0].hardware)}. ${pct(det, tot)}% das escolhas vieram da detecção automática.`); }
  if ((d.usos || []).length) out.push(`Uso mais filtrado no Radar: ${esc(d.usos[0].uso)}.`);
  const o = (d.origens || []).filter(x => x.origem !== '(direto)')[0];
  if (o) out.push(`Melhor fonte externa: ${esc(o.origem)} (${o.visitas} visitas, ${o.pct_radar ?? 0}% viram o Radar).`);
  out.push(t.benchmarks ? `Comunidade: ${t.benchmarks} resultados de ${t.maquinas} máquinas (${t.benchmarks_7d} nesta semana).` : 'Comunidade: nenhum resultado enviado ainda.');
  return out;
}
async function abrir(senha) {
  $('#st').textContent = 'Carregando…';
  const r = await fetch('/api/coleta', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fn: 'painel_resumo', dados: { p_senha: senha } }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { $('#st').textContent = d.message || 'Erro ' + r.status; return; }
  try { sessionStorage.setItem('li-painel', senha); } catch (e) {}
  $('#f').style.display = 'none';
  const t = d.totais, sem = d.semana || {}, k = (n, l, x = '') => `<div class="kpi"><span class="sub">${l}</span><b>${n ?? 0}${x}</b></div>`;
  const s7 = tp => (sem[tp] || {}).atual || 0;
  const topo = d.funil[0].n || 1;
  $('#out').innerHTML =
    `<div class="kpis">${k(t.visitas_30d, 'Visitas, 30 dias')}${k(s7('pagina'), 'Visitas, 7 dias', delta(sem, 'pagina'))}${k(s7('download'), 'Downloads, 7 dias', delta(sem, 'download'))}${k(s7('copiar'), 'Copiaram comando, 7 dias', delta(sem, 'copiar'))}${k(t.novas_pct, 'Visitas novas', '%')}${k(t.celular_pct, 'Do celular', '%')}${k(t.abas_por_visita, 'Abas por visita')}${k(t.benchmarks, 'Resultados da comunidade')}</div>` +
    '<h2>Leituras rápidas</h2><div class="caixa"><ul class="insights">' + leituras(d).map(x => `<li>${x}</li>`).join('') + '</ul></div>' +
    '<h2>Funil (30 dias, por visita)</h2><div class="caixa funil">' + d.funil.map(x =>
      `<div class="funil-l"><span>${esc(x.etapa)}</span><span class="barra"><i style="width:${Math.max(1, pct(x.n, topo))}%"></i></span><b class="n" style="text-align:right">${x.n} · ${pct(x.n, topo)}%</b></div>`).join('') + '</div>' +
    '<h2>Site</h2><div class="grade">' +
    tabela('Por dia', d.diario, [['dia','Dia'],['visitas','Visitas','n'],['radar','Radar','n'],['comandos','Comandos','n'],['downloads','Downloads','n']]) +
    tabela('De onde vêm', d.origens, [['origem','Origem'],['visitas','Visitas','n'],['pct_radar','% Radar','n'],['baixaram','Baixaram','n']], 'Use links com ?utm_source=nome para separar cada divulgação.') +
    tabela('Hardware das visitas', d.hardware_site, [['hardware','Hardware'],['visitas','Visitas','n'],['detectado','Detectado','n']], 'Base para escolher afiliados de placas.') +
    tabela('Usos procurados no Radar', d.usos, [['uso','Uso'],['visitas','Visitas','n']]) +
    tabela('Modelos mais copiados', d.modelos_copiados, [['modelo','Modelo'],['copias','Cópias','n']]) +
    tabela('Abas mais vistas', d.abas, [['aba','Aba'],['visitas','Visitas','n']]) +
    tabela('Idioma do navegador', d.idiomas, [['idioma','Idioma'],['visitas','Visitas','n']]) +
    tabela('De onde saiu o download', d.downloads_origem, [['origem','Botão'],['n','Downloads','n']]) +
    '</div><h2>Comunidade (resultados enviados pelo app)</h2><div class="grade">' +
    tabela('Placas', d.placas_comunidade, [['placa','Placa'],['envios','Envios','n'],['modelos','Modelos','n']]) +
    tabela('Modelo × placa', d.modelos_comunidade, [['modelo','Modelo'],['placa','Placa'],['envios','Envios','n'],['nota_media','Nota média','n'],['tps_medio','tok/s','n']]) +
    `</div><p class="sub">Atualizado em ${new Date(d.gerado).toLocaleString('pt-BR')}. Visitas de teste (pré-visualizações e localhost) ficam de fora.</p>`;
}
$('#f').onsubmit = e => { e.preventDefault(); abrir($('#s').value); };
try { const s = sessionStorage.getItem('li-painel'); if (s) abrir(s); } catch (e) {}
</script>
</body></html>
