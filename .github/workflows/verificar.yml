name: Verificar

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Site igual ao app (fonte única em download/LocalIntelligence/web)
        run: python scripts/sincronizar-web.py --verificar
      - name: Páginas por placa (o gerador monta todas sem erro)
        run: node scripts/gerar-paginas.js --verificar
      - name: Testes do app (inclui paridade JS × Python)
        working-directory: download/LocalIntelligence
        run: python -m unittest discover -s tests
