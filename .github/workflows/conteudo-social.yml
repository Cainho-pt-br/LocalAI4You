name: Gerar conteúdo social

on:
  schedule:
    # Roda todo dia às 09:00 UTC (logo após a atualização diária do catálogo às 08:17 UTC)
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      pauta:
        description: "ID da pauta (deixe vazio para rotação automática do dia)"
        required: false
        default: ""
      idioma:
        description: "Idioma: todos, pt ou en"
        required: false
        default: "todos"

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar Playwright, Edge-TTS e FFmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet playwright edge-tts
          playwright install chromium

      - name: Gerar pauta, roteiros, HTMLs e legendas com UTM
        run: |
          ARGS="--idioma=${{ inputs.idioma || 'todos' }}"
          if [ -n "${{ inputs.pauta }}" ]; then
            ARGS="$ARGS --pauta=${{ inputs.pauta }}"
          fi
          node scripts/gerar-conteudo-social.js $ARGS

      - name: Renderizar carrosséis (PNG) e vídeos 9:16 (MP4 com narração)
        run: python scripts/render-conteudo-social.py conteudo-social

      - name: Publicar pacote pronto como Artifact (30 dias)
        uses: actions/upload-artifact@v7
        with:
          name: conteudo-social-${{ github.run_number }}
          path: conteudo-social/
          retention-days: 30
