name: Atualizar catálogo público

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Atualizar catálogo usando o radar do projeto
        env:
          # opcional: token gratuito do Hugging Face (Settings → Access Tokens, só leitura) evita o limite por IP
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/atualizar-catalogo-publico.py
      - name: Refazer as páginas por placa com o catálogo novo
        # Se falhar, o catálogo é publicado assim mesmo e as páginas ficam como estavam (o passo aparece com aviso).
        continue-on-error: true
        run: node scripts/gerar-paginas.js
      - name: Salvar catálogo novo
        id: commit
        run: |
          if git diff --quiet -- site/dados.js download/LocalIntelligence/data/radar-inicial.json.gz; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/dados.js download/LocalIntelligence/data/radar-inicial.json.gz
          git add -A site/placa site/en site/es site/sitemap.xml
          git commit -m "Atualiza catálogo público de modelos"
          # A varredura leva ~10 min; se a main andou nesse tempo (merge de PR), traz as novidades por baixo do commit
          # do catálogo e tenta de novo. Num conflito, vale o que acabou de ser gerado (catálogo e páginas por placa são só saída).
          for tentativa in 1 2 3 4; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"; then
              # se a main trouxe um molde novo das páginas por placa, refaz com o que vale agora (não mistura os dois)
              if node scripts/gerar-paginas.js; then
                git add -A site/placa site/en site/es site/sitemap.xml
                git diff --cached --quiet || git commit -m "Atualiza páginas por placa"
              fi
              git push && break
            fi
            git rebase --abort 2>/dev/null || true
            echo "push recusado (tentativa $tentativa), tentando de novo"
            sleep $((tentativa * 5))
            if [ "$tentativa" = 4 ]; then echo "não consegui enviar o catálogo" >&2; exit 1; fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Solicitar publicação no Vercel
        if: steps.commit.outputs.changed == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
          else
            echo "Catálogo foi enviado ao Git; configure VERCEL_DEPLOY_HOOK para publicar automaticamente."
          fi
